[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "PhylogicNDT"
version = "2.0.0"
description = "Analysis of tumor heterogeneity and evolution"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PhylogicNDT"
license-files = ["LICENSE"]
dependencies = [
    "intervaltree>=3.1",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2"]

[project.scripts]
PhylogicNDT = "PhylogicNDT:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "PhylogicNDT.py",
    "BuildTree",
    "Cluster",
    "GrowthKinetics",
    "LeagueModel",
    "PhylogicSim",
    "SinglePatientTiming",
    "data",
    "output",
    "utils",
]

[tool.hatch.build.targets.sdist]
include = [
    "/PhylogicNDT.py",
    "/BuildTree",
    "/Cluster",
    "/GrowthKinetics",
    "/LeagueModel",
    "/PhylogicSim",
    "/SinglePatientTiming",
    "/data",
    "/output",
    "/utils",
    "/ExampleData",
    "/ExampleRuns",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
